# The Studio's integration contract (OpenAPI 3.1): the routes a bank's own systems call -- read alerts and cases,
# decide on them, export them, start a collection or a run. Served by the Studio at /api/openapi.yaml and published
# in the documentation (fraud-engineering-studio-docs). Checked against the routes the server declares: tools/check_openapi.py.
openapi: 3.1.0
info:
  title: Fraud Engineering Studio API
  version: 1.3.0
  summary: Read and act on alerts and cases from your own systems.
  description: |
    The integration contract of the Fraud Engineering Studio: the routes your case-management system, SIEM or data
    platform calls to read alerts and cases, record decisions, export results, read and export the detection logic, and start
    collections or runs.

    **Status.** This is the contract the Studio implements today.

    **Authentication.** Send `Authorization: Bearer <key>`. A key stands for one user of the Studio, with that user's
    rights, and may be held to one organisation. Only a hash of each key is kept: a key is shown once, when an
    administrator creates it. From the Studio's own machine a call without a key is the browser's; from any other
    machine, every call needs a key.
    A wrong or revoked key gets `401`.

    **Organisations.** One Studio can serve several organisations, each with its own data, calibrations and lists.
    Every request acts for one: send the header `X-Studio-Org: <organisation id>` (see `GET /api/organisations`).
    Without it, the request acts for the platform's own organisation.

    **Sites are named by their link.** A website (`ExternalDomain`) is shown and returned with the link it was found
    with, its path kept (`entity.label`, `url`) — never the bare domain alone.

    All bodies are JSON (`Content-Type: application/json`). Errors return `{"error": "<message>"}` with
    `400` (invalid request), `404` (not found) or `500` (server error).
servers:
  - url: "https://{host}"
    description: Your Studio, where your organisation runs it.
    variables:
      host: { default: studio.example-bank.com, description: "The address of your Studio." }
security:
  - apiKey: []
tags:
  - name: Knowledge
    description: The typologies and their scenarios, as written, calibrated and exported.
  - name: Calibration
    description: The values a scenario runs with in this Studio, versioned.
  - name: Lists
    description: Your brands, trusted parties and watchlists, which scenarios check against.
  - name: Sources
    description: The systems the Studio collects data from.
  - name: Analyses
    description: A typology run on the current data, with the scenarios chosen.
  - name: Alerts
    description: What a detection raised, one per unit (a page, a domain, an account...) and per run.
  - name: Cases
    description: An investigation of one subject. Opened when an alert is escalated, or by hand.
  - name: Threat Monitoring
    description: The use cases that watch for fraud — online scams, fraudulent webshops, payments to reported mules — and what they found.
  - name: Threat Intelligence
    description: Cases, scenarios and signals shared between organisations. No customer data is shared.
  - name: Replies
    description: Answers to the people who reported a site, through the source that collected their report.
  - name: Pentesting
    description: A fraudster's behaviour played on the institution's own application in staging, and what its defences did.
  - name: Coverage
    description: What each scenario is — calibrated, tested, pentested, in service — and since when.
  - name: Organisations
    description: The organisations one Studio serves; every request acts for one.
  - name: Data
    description: Production and the labelled test datasets.
  - name: Exports
    description: Alerts and cases as files, for a data platform or a report.
  - name: Collection
    description: Start a data collection from a source, and follow it.
  - name: Service
    description: Is the Studio up.
  - name: Inspection
    description: "What the Studio knows of a record -- a site, a page, an account -- and what a source saw when it looked at it as a visitor would (evidence: captures, forms, where it leads). Reverse engineering of a site's kit is operators only."
  - name: Settings
    description: This organisation's settings, for everyone who uses it.
  - name: Kit hunting
    description: "The other sites of a phishing or fake-shop kit, found by what identifies the kit (its markers). Operators only."

paths:
  /api/ping:
    get:
      tags: [Service]
      operationId: ping
      summary: Check the service
      responses:
        "200":
          description: The Studio is up.
          content: { application/json: { schema: { type: object, properties: { studio: { type: boolean } } }, example: { studio: true } } }

  /api/typologies:
    get:
      tags: [Knowledge]
      operationId: listTypologies
      summary: List typologies
      responses:
        "200":
          description: The typologies this Studio runs, with their scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug: { type: string, example: credential-phishing }
                    name: { type: string, example: Brand Impersonation -- Online }
                    scenarios: { type: array, items: { type: string }, example: [FSL-CRP-001, FSL-CRP-002] }
                    ready: { type: boolean, description: "Whether it can run (at least one calibrated scenario)." }

  /api/scenarios:
    post:
      tags: [Knowledge]
      operationId: createScenario
      summary: Create a scenario
      description: |
        A new scenario, as a **draft**: its title and steps, each step naming an existing indicator. A Given is a fact about
        the record itself, never how it was found. Checked before it is
        kept, like an edit; its id, journey stage, owner and parameters are deduced from the typology's scenarios on the
        same unit. Rule conditions only — a condition the AI judges is added with ✦ Write with AI. A scenario runs once
        it is calibrated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioNew" }
            example:
              typology: credential-phishing
              unit: UNIT-WEB-SITE
              title: A look-alike website that asks for its visitors' secrets
              steps:
                - { role: given, text: "the domain is not one of the brand's own domains", indicator: IND-DOMAIN-NOT-BRAND-OWNED }
                - { role: when, text: "the site answers with a page of its own", indicator: IND-SITE-IS-LIVE }
                - { role: when, text: "the domain name resembles the brand", indicator: IND-DOMAIN-RESEMBLES-BRAND }
              note: Sites that collect credentials, reported by the fraud desk.
      responses:
        "200": { description: The new scenario., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/scenarios/{scenario_id}/retire:
    post:
      tags: [Knowledge]
      operationId: retireScenario
      summary: Retire a scenario
      description: The scenario no longer runs. Its versions, runs and alerts are kept — a detection that raised alerts is never deleted.
      parameters: [{ $ref: "#/components/parameters/scenario_id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Note" }, example: { note: "Replaced by FSL-CRP-007." } } }
      responses:
        "200": { description: "The scenario, retired.", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/scenarios/{scenario_id}:
    get:
      tags: [Knowledge]
      operationId: getScenario
      summary: Get a scenario
      description: The scenario as written — its title, its Given and When steps with the indicator of each, and the questions its AI conditions ask. A triage id (TRI-…) returns the triage's rules.
      parameters: [{ $ref: "#/components/parameters/scenario_id" }]
      responses:
        "200": { description: The scenario., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Knowledge]
      operationId: updateScenario
      summary: Update a scenario or a triage
      description: |
        A new version, with a note saying why. A scenario: its title, its steps (each naming an existing indicator) and
        the questions of its AI conditions. A triage (TRI-…): its rules in order — the first whose conditions all hold
        gives the result. Checked before it is kept; a change that does not pass is refused and nothing is written.
      parameters: [{ $ref: "#/components/parameters/scenario_id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { oneOf: [{ $ref: "#/components/schemas/ScenarioUpdate" }, { $ref: "#/components/schemas/TriageUpdate" }] }
      responses:
        "200": { description: "The scenario or the triage, new version.", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/detections/{scenario_id}:
    get:
      tags: [Knowledge]
      operationId: getDetection
      summary: Get a scenario's detection
      description: What runs — the scenario's conditions with their indicators and AI questions — and this Studio's calibration of it (values, version, history).
      parameters: [{ $ref: "#/components/parameters/scenario_id" }]
      responses:
        "200": { description: The detection and its calibration., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Calibration]
      operationId: calibrate
      summary: Calibrate a scenario
      description: A new calibration version — the values of its rule parameters and the AI answers that count — with a note saying why. The next runs use it.
      parameters: [{ $ref: "#/components/parameters/scenario_id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                rules: { type: object, description: "Parameter name → value.", additionalProperties: true }
                ai: { type: object, description: "AI question → the answers that count as met.", additionalProperties: true }
                note: { type: string }
            example: { rules: { max_followers: 500 }, note: "Small pages only." }
      responses:
        "200": { description: The detection with its new calibration., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/ofef-export/{typology}:
    get:
      tags: [Knowledge]
      operationId: exportTypology
      summary: Export a typology
      description: |
        A typology and its scenarios as portable files — the scenarios in Gherkin, their indicators, features and AI
        questions — for another detection engine or for review, built on demand. It is an execution package: only the
        features the chosen scenarios need, `context.yaml` (the context to compute: per unit, one column per feature and what it reads), `dependencies.yaml`
        (the graph) and one SQL script per scenario (`sql/<id>.sql`, the engine's steps over the canonical tables). With
        `calibration=1`, this Studio's calibration is included and its values are written into the scripts.
      parameters:
        - { name: typology, in: path, required: true, schema: { type: string }, example: credential-phishing }
        - { name: scenarios, in: query, description: "Only these scenarios, comma-separated (all when absent).", schema: { type: string } }
        - { name: calibration, in: query, schema: { type: integer, enum: [0, 1], default: 0 } }
      responses:
        "200": { description: A zip file., content: { application/zip: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/lists:
    get:
      tags: [Lists]
      operationId: listLists
      summary: List lists
      responses:
        "200": { description: The lists and the kinds of list., content: { application/json: { schema: { type: object } } } }
    post:
      tags: [Lists]
      operationId: createList
      summary: Create a list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, kind]
              properties:
                id: { type: string, example: trusted-partners }
                name: { type: string, example: Trusted partners }
                kind: { type: string, description: "Own, trusted or watchlist (GET /api/lists gives the kinds)." }
                publisher: { type: string }
                description: { type: string }
      responses:
        "200": { description: The list., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/active/brands:
    get:
      tags: [Lists]
      operationId: getProtectedBrands
      summary: The brands this organisation protects
      description: "Its brand scope: what Threat Monitoring keeps and what the findings connections ask for (`organizations: scope`). `missing_from_list`: brands of the scope not in the protected-brands list -- their findings would be left out; `not_protected`: entries of the list this organisation does not protect."
      responses:
        "200": { description: The scope., content: { application/json: { schema: { $ref: "#/components/schemas/BrandScope" } } } }
    post:
      tags: [Lists]
      operationId: setProtectedBrands
      summary: Protect a brand, or stop
      description: "Adds brands to this organisation's scope, or takes them out. A brand must be in the protected-brands list first (POST /api/lists/protected-brands: its names and official domains). The next collection asks for it and the next analysis keeps its findings. Operators only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add: { type: array, items: { type: string }, example: [example-bank] }
                remove: { type: array, items: { type: string } }
      responses:
        "200": { description: The scope., content: { application/json: { schema: { $ref: "#/components/schemas/BrandScope" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { description: Not for a client's users. }

  /api/lists/{list_id}:
    parameters: [{ name: list_id, in: path, required: true, schema: { type: string }, example: protected-brands }]
    get:
      tags: [Lists]
      operationId: getList
      summary: Get a list
      responses:
        "200": { description: The list and its entries., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Lists]
      operationId: changeList
      summary: Add, update or remove an entry
      description: "`{entry}` adds an entry, or replaces the one named by `original`; `{action: remove, id}` removes one."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [entry]
                  properties:
                    entry: { $ref: "#/components/schemas/ListEntry" }
                    original: { type: string, description: "The id of the entry it replaces." }
                - type: object
                  required: [action, id]
                  properties: { action: { type: string, enum: [remove] }, id: { type: string } }
            example: { entry: { name: Example Bank, identifiers: { domain: [example-bank.com], name: [example bank] } } }
      responses:
        "200": { description: The list., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: List sources
      responses:
        "200": { description: "The sources and enrichments, what each holds and its last collections.", content: { application/json: { schema: { type: object } } } }
    post:
      tags: [Sources]
      operationId: saveSource
      summary: Create or update a source
      description: Checked before it is written — a known connector, an existing mapping, a configuration the connector accepts. Secrets are never sent here; they are set on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, connector, mapping_ref]
              properties:
                id: { type: string }
                name: { type: string }
                connector: { type: string }
                mapping_ref: { type: string }
                default_mode: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        "200": { description: The source., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/sources/{source_id}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get a source
      parameters: [{ name: source_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The source., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sources/{source_id}/archive:
    post:
      tags: [Sources]
      operationId: archiveSource
      summary: Archive a source
      description: The source no longer collects; what it collected stays.
      parameters: [{ name: source_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Archived., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/analyses:
    get:
      tags: [Analyses]
      operationId: listAnalyses
      summary: List analyses
      responses:
        "200": { description: The analyses., content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Analyses]
      operationId: createAnalysis
      summary: Create an analysis
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, typology], properties: { name: { type: string }, typology: { type: string } } }
            example: { name: Brand watch — weekly, typology: credential-phishing }
      responses:
        "200": { description: The analysis., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/analyses/{analysis_id}:
    parameters: [{ name: analysis_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Analyses]
      operationId: getAnalysis
      summary: Get an analysis
      responses:
        "200": { description: "The analysis, its scenarios and its runs.", content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Analyses]
      operationId: renameAnalysis
      summary: Rename an analysis
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        "200": { description: The analysis., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/context:
    get:
      tags: [Knowledge]
      operationId: scenariosContext
      summary: What a selection of scenarios needs
      description: Their dependency graph (indicators, features, canonical fields and lists), whether each field is present in the data checked, the history needed, and whether each scenario can decide in real time (every indicator ex_ante).
      parameters:
        - { name: scenarios, in: query, required: true, description: "Scenario ids, comma-separated.", schema: { type: string }, example: "FSL-MULE-008,FSL-MULE-011" }
        - { name: dataset, in: query, description: "The data to check against (default: production).", schema: { type: string }, example: fca-sandbox }
        - { name: lineage, in: query, description: "1: the lineage only (knowledge, no data): per unit, the fields read -> the context columns -> the steps.", schema: { type: integer, enum: [0, 1] } }
      responses:
        "200": { description: "{scenarios, entities, lists, populations, counts}" }
  /api/investigations:
    get:
      tags: [Alerts]
      operationId: investigationsOverview
      summary: The Investigations page
      description: Every alert in a compact form (typology, scenarios, priority, status, what it was found for, the sources that found it, the typology's reports once confirmed) and the cases with their reports outside.
      responses:
        "200": { description: "{alerts: [...], cases: [...]}" }
  /api/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: List alerts
      parameters:
        - { name: typology, in: query, description: "Typology ids, comma-separated.", schema: { type: string }, example: credential-phishing }
        - { name: status, in: query, description: "Statuses, comma-separated.", schema: { type: string, enum: [new, closed, escalated] }, example: new }
      responses:
        "200":
          description: The alerts, the most recent first.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Alert" } } } }
    post:
      tags: [Alerts]
      operationId: raiseAlert
      summary: Raise an alert by hand
      description: An alert on any record, when no scenario retained it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, id]
              properties:
                entity: { type: string, example: ExternalDomain }
                id: { type: string, example: secure-login-example.com }
                typology: { type: string, example: credential-phishing, description: "Empty: not determined yet -- closed with the generic reasons, or qualified in its case." }
                use_case: { type: string, description: "The use case it is raised from: where an alert with no typology is listed." }
                priority: { type: string, enum: [critical, high, medium, low], description: "The analyst's priority, set from the start; the triage's comes beside it with the next run." }
                note: { type: string, description: Why it is raised. }
      responses:
        "200": { description: The alert., content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/alerts/{alert_id}:
    parameters: [{ $ref: "#/components/parameters/alert_id" }]
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: Get an alert
      responses:
        "200": { description: "The alert, with what its scenarios found.", content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Alerts]
      operationId: decideAlert
      summary: Decide on an alert
      description: |
        Close it with one of its typology's reasons, escalate it to the case of its subject (a new case if none is
        open), or reopen it (the decision and its effects are undone). `set_priority` sets the analyst's priority, with a
        note: it wins over the triage's, which later runs keep updating beside it (`triage.machine`); an empty priority
        goes back to the triage's. `merge` closes a duplicate into another alert on the same subject (`into`): it
        leaves its case's alerts, its history is kept, reopen undoes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertDecision" }
            examples:
              escalate: { value: { action: escalate, note: "Same site as the case already open." } }
              close: { value: { action: close, disposition: homonym, note: "A shop with the same name." } }
      responses:
        "200": { description: The alert after the decision., content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: List cases
      parameters:
        - { name: typology, in: query, description: "Typology ids, comma-separated.", schema: { type: string } }
        - { name: status, in: query, description: "Statuses, comma-separated.", schema: { type: string }, example: "open,in_review" }
      responses:
        "200":
          description: The cases, the most recent first.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Case" } } } }
    post:
      tags: [Cases]
      operationId: openCase
      summary: Open a case
      description: |
        A case opened by hand: a fraud known from elsewhere (a complaint, a report), or a record found while
        investigating another case (`from_case`). If a case is already open on this subject, it is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseOpen" }
            example: { entity: ExternalDomain, id: secure-login-example.com, typology: credential-phishing, from_case: C-20261013-1a2b3c }
      responses:
        "200": { description: The case., content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/cases/{case_id}:
    parameters: [{ $ref: "#/components/parameters/case_id" }]
    get:
      tags: [Cases]
      operationId: getCase
      summary: Get a case
      responses:
        "200": { description: "The case, its alerts, notes, history and related cases.", content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Cases]
      operationId: actOnCase
      summary: Act on a case
      description: |
        `review` (in review), `close` (with a reason of one of its typologies), `reopen` (effects undone), `note`
        (add a note), `qualify` (the fraud's qualification, required to close as confirmed fraud).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseAction" }
            examples:
              note: { value: { action: note, note: "Hosting provider notified." } }
              close: { value: { action: close, typology: credential-phishing, disposition: impersonation, note: "Site taken down." } }
      responses:
        "200": { description: The case after the action., content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/cases/{case_id}/share:
    parameters: [{ $ref: "#/components/parameters/case_id" }]
    get:
      tags: [Cases]
      operationId: shareCase
      summary: Get a case to share
      description: A confirmed fraud in a shareable form, without your internal notes, for another institution or a fraud-sharing network.
      responses:
        "200": { description: The shareable case., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/cases/{case_id}/reports:
    parameters: [{ $ref: "#/components/parameters/case_id" }]
    post:
      tags: [Cases]
      operationId: reportCase
      summary: Record that a case was reported
      description: The case was reported outside -- to an authority, a platform, another institution -- by your own means. Records to whom, when and the reference, never the report itself.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to, recipient]
              properties:
                to: { type: string, enum: [authority, platform, institution, other] }
                recipient: { type: string, example: "the financial intelligence unit" }
                reference: { type: string }
                sent: { type: string, format: date, description: "Default: today." }
                note: { type: string }
      responses:
        "200": { description: "The case, with its reports.", content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "400": { description: Missing or wrong field. }
  /api/cases/{case_id}/reports/{report_id}:
    parameters: [{ $ref: "#/components/parameters/case_id" }, { name: report_id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Cases]
      operationId: updateCaseReport
      summary: Follow the answer to a report, or withdraw it
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [sent, acknowledged, acted_on, no_action] }
                reference: { type: string }
                note: { type: string }
                action: { type: string, enum: [withdraw], description: "A report recorded by mistake: no longer shown, never erased." }
      responses:
        "200": { description: "The case, with its reports.", content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "400": { description: "No such report, or a wrong status." }
  /api/reports:
    get:
      tags: [Exports]
      operationId: listReports
      summary: The reports this deployment runs
      description: The reports of the knowledge base (OFEF reports/*.yaml) -- id, name, question, parameters.
      responses:
        "200": { description: The reports., content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/reports/{report_id}:
    parameters: [{ name: report_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Exports]
      operationId: runReport
      summary: Run a report
      description: Each section's rows, computed now on the real data. Parameters (e.g. days) as query values.
      responses:
        "200": { description: The report., content: { application/json: { schema: { type: object } } } }
  /api/reports/{report_id}/export:
    parameters: [{ name: report_id, in: path, required: true, schema: { type: string } }, { name: format, in: query, schema: { type: string, enum: [csv, json] } }]
    get:
      tags: [Exports]
      operationId: exportReport
      summary: Export a report
      description: "json: the whole report; csv: its detail sections (a zip when there are several)."
      responses:
        "200": { description: A file. }
  /api/export/{kind}:
    get:
      tags: [Exports]
      operationId: export
      summary: Export alerts, cases or reports
      parameters:
        - { name: kind, in: path, required: true, description: "reports: one row per report of a case.", schema: { type: string, enum: [alerts, cases, reports] } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json, parquet], default: csv } }
        - { name: typology, in: query, description: "Typology ids, comma-separated.", schema: { type: string } }
        - { name: status, in: query, description: "Statuses, comma-separated.", schema: { type: string } }
      responses:
        "200":
          description: A file, one row per alert or case.
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: array, items: { type: object } } }
            application/vnd.apache.parquet: { schema: { type: string, format: binary } }

  /api/sources/{source_id}/refresh:
    post:
      tags: [Collection]
      operationId: startCollection
      summary: Start a collection
      parameters: [{ name: source_id, in: path, required: true, schema: { type: string }, example: ad-library-be }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, description: "One of the source's modes (its default when absent)." }
                scope: { type: array, items: { type: string }, description: "Only these list entries or topics." }
            example: { mode: update, scope: [example-bank] }
      responses:
        "200":
          description: The id of the job started (or of the one already running for this source).
          content: { application/json: { schema: { type: object, properties: { job: { type: string } } }, example: { job: 20261025_091500_ab12 } } }

  /api/refresh/{job_id}:
    get:
      tags: [Collection]
      operationId: getCollection
      summary: Follow a collection
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The job., content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/analyses/{analysis_id}/runs:
    post:
      tags: [Analyses]
      operationId: startRun
      summary: Start a run
      description: "On the real data, the findings whose priority the analysis sends by itself (auto_alert) become alerts; the others can be sent by hand. On a test dataset (header X-Studio-Dataset), the run is measured against its labels and raises no alert."
      parameters: [{ name: analysis_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { scenarios: { type: array, items: { type: string }, description: "Only these scenarios (all when absent)." }, reuse: { type: array, items: { type: string }, description: "The scenarios whose earlier AI answers are reused." } } }
      responses:
        "200": { description: The id of the run started (or of the one already running)., content: { application/json: { schema: { type: object, properties: { run: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/runs/{run_id}:
    get:
      tags: [Analyses]
      operationId: getRun
      summary: Follow a run
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "The run, its progress and counts.", content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/detections:
    get:
      tags: [Analyses]
      operationId: listRunDetections
      summary: List what a run found
      description: |
        One row per unit found, with its priority, whether it is already in Alerts, and the priority it had in the
        previous run of the same analysis. A site is named by the link it was found with (`entity.label`, `url`).
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The detections of the run.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Detection" } } } }

  /api/runs/{run_id}/send:
    post:
      tags: [Analyses]
      operationId: sendRunToAlerts
      summary: Send findings to Alerts
      description: |
        Raises one alert per unit for the detections of the chosen scenarios and paths — all of them when `selection`
        is left out. Each alert takes its finding's priority. Not allowed on a test dataset: a run there is measured,
        its findings never become alerts.
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                selection: { type: array, description: "[scenario, path] pairs; path is rules or ai.", items: { type: array, items: { type: string } }, example: [[FSL-CRP-002, ai]] }
                units: { type: array, description: Only these units., items: { type: string } }
      responses:
        "200": { description: The alerts raised or refreshed., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/datasets:
    get:
      tags: [Data]
      operationId: listDatasets
      summary: List datasets
      description: |
        Production and the test datasets — synthetic or imported, with labels. Send the header `X-Studio-Dataset` with
        a test dataset's id on the analysis routes to run on it: its runs are measured against the labels and never
        raise alerts.
      responses:
        "200": { description: The datasets., content: { application/json: { schema: { type: array, items: { type: object } } } } }

  /api/organisations:
    get:
      tags: [Organisations]
      operationId: listOrganisations
      summary: List organisations
      description: |
        The organisations this platform serves, and the one the request acts for. Every other route reads and writes
        the data of that organisation only: set it with the header `X-Studio-Org` (or the cookie `studio_org` the
        page sets). Without either, the request acts for the platform's own organisation.
      responses:
        "200":
          description: The organisations and the current one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: string, example: bank-1 }
                  pinned: { type: boolean, description: "The Studio is locked on one organisation: only that one is listed." }
                  organisations: { type: array, items: { $ref: "#/components/schemas/Organisation" } }

  /api/exchange:
    post:
      tags: [Threat Intelligence]
      operationId: share
      summary: Share a case, a scenario or signals
      description: |
        `case`: the case share of a confirmed fraud (no customer data), with the signal it names and the scenarios
        that found it. `scenario`: a scenario as written, never its calibration. `signals`: identifiers to watch.
        One item per recipient; nothing is written in a recipient's data until it accepts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRequest" }
            examples:
              case: { value: { kind: case, ref: C-20261117-4d5e6f, to: [bank-1], note: "Mule account, investment scam." } }
              scenario: { value: { kind: scenario, ref: FSL-ATO-013, to: [bank-1] } }
              signals: { value: { kind: signals, signals: [{ kind: account, value: "02-02-02|20000507", since: "2022-12-10" }], to: [bank-1, bank-3] } }
      responses:
        "200":
          description: Sent.
          content: { application/json: { schema: { type: object, properties: { batch: { type: string }, to: { type: array, items: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/exchange/{key}:
    get:
      tags: [Threat Intelligence]
      operationId: readExchange
      summary: Read what was shared
      description: |
        `peers`: the organisations this one can share with. `inbox`: what it received. `outbox`: what it sent.
        `counts`: how many items are new, received and sent. Received items carry what was shared only — never the
        receiver's own data.
      parameters:
        - { name: key, in: path, required: true, description: "peers, inbox, outbox or counts.", schema: { type: string, enum: [peers, inbox, outbox, counts] } }
      responses:
        "200":
          description: The list asked for (an object for counts).
          content: { application/json: { schema: { oneOf: [{ type: array, items: { $ref: "#/components/schemas/SharedItem" } }, { type: object }] } } }
    post:
      tags: [Threat Intelligence]
      operationId: acceptShared
      summary: Act on what was received
      description: |
        `watch`: its signals become entries of the watchlist of their kind (an account goes to **Mule accounts**),
        listed from the date the sender detected them. `activate`: its scenarios are switched on here and run with this
        organisation's own calibration. `dismiss`: nothing is kept.
      parameters: [{ name: key, in: path, required: true, description: "The id of the item received.", schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [watch, activate, dismiss] }
                scenarios: { type: array, items: { type: string }, description: "With activate: only these (default: all it carries)." }
      responses:
        "200":
          description: The item's new status and what it did.
          content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string, enum: [accepted, dismissed] }, outcome: { type: object } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/scam/triage:
    get:
      tags: [Threat Monitoring]
      operationId: listFindings
      summary: List findings
      description: |
        Every finding of the Threat Monitoring use cases: what the last run of each found, with its priority and where
        it stands — to triage, triaged, new or escalated (it has an alert or a case), closed, watch (online, retained by
        no scenario). A finding closed and then found again by a later run comes back. A site is named by the link
        it was found with. Filters (each a comma-separated list) keep only the matching rows; `total` then counts them.
      parameters:
        - { name: group, in: query, schema: { type: string }, example: fraudulent-webshops }
        - { name: status, in: query, description: "alert, taken_down, none (no alert, not taken down).", schema: { type: string }, example: none }
        - { name: state, in: query, description: "to_triage, new, watch, blocked, gone...", schema: { type: string } }
        - { name: priority, in: query, description: "critical, high, medium, low, none.", schema: { type: string }, example: "critical,high" }
        - { name: source, in: query, description: "The finding's source.", schema: { type: string }, example: kit-siblings }
        - { name: since, in: query, description: "new or changed since the pass before.", schema: { type: string, enum: [new, changed] } }
        - { name: threat, in: query, description: "The threat state, at the date it was seen (threat_seen): live, cloaked, not_active, blocked, suspended, removed, offline, unreadable, none (not read yet); taken_down = blocked, suspended or removed.", schema: { type: string }, example: "live,cloaked" }
        - { name: to_watch, in: query, description: "Only the findings to watch: no alert, and a low severity or not active yet. Computed, never stored.", schema: { type: boolean } }
        - { name: q, in: query, description: "A piece of the record's domain, address or name.", schema: { type: string }, example: example-shop }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The findings, per use case.
          content: { application/json: { schema: { type: object, properties: { rows: { type: array, items: { $ref: "#/components/schemas/Finding" } }, groups: { type: array, items: { type: object } }, running: { type: [object, "null"] } } } } }
    post:
      tags: [Threat Monitoring]
      operationId: runMonitoring
      summary: Run a use case
      description: Collects its sources, runs its typologies and triages what they found, in the background.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                group: { type: string, description: "The use case (default: the first).", example: online-scams }
                step: { type: string, enum: [all, run, triage], default: all }
                only: { type: array, items: { type: string }, description: "The records to analyse, and only them (domains, page ids). No collect: they are already here.", example: [example-shop.com] }
      responses:
        "200": { description: The pass started., content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }

  /api/scam/triage/alerts:
    post:
      tags: [Threat Monitoring]
      operationId: sendFindingsToAlerts
      summary: Send findings to Alerts
      description: |
        Each finding sent from the latest run of the use case that found it, as the Findings list sends it: the alert
        carries its scenarios, its trace and its finding's priority. An open alert on it is refreshed, never duplicated.
        A record no run detected is returned in `not_detected`: raising it is a decision by hand (POST /api/alerts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, ids]
              properties:
                group: { type: string, example: fraudulent-webshops }
                ids: { type: array, items: { type: string }, description: "Domains, page ids, or Type|id.", example: [example-shop.com] }
                note: { type: string, description: "Why, kept in each alert's history." }
      responses:
        "200":
          description: The alerts raised or refreshed, and what no run detected.
          content: { application/json: { schema: { type: object, properties: {
            raised: { type: array, items: { type: object, properties: { id: { type: string }, alert_id: { type: string }, typology: { type: string }, run: { type: string }, priority: { type: [string, "null"] } } } },
            not_detected: { type: array, items: { type: string } }, runs: { type: array, items: { type: object } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/scam/triage/runs:
    get:
      tags: [Threat Monitoring]
      operationId: listMonitoringRuns
      summary: What the last pass ran
      parameters: [{ name: group, in: query, schema: { type: string }, example: online-scams }]
      responses:
        "200": { description: "Per typology, its run and its scenarios.", content: { application/json: { schema: { type: object } } } }

  /api/records/{entity}/{record_id}/reporters:
    get:
      tags: [Replies]
      operationId: listReporters
      summary: Who waits for an answer
      description: |
        Per source that takes answers (a public check site, for example): the people who reported this record and are
        still waiting, by language, and the outcomes the source accepts.
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string }, example: ExternalDomain }
        - { name: record_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The reporters and the record's open case, if any.
          content: { application/json: { schema: { type: object, properties: { reporters: { type: array, items: { $ref: "#/components/schemas/Reporters" } }, case_id: { type: [string, "null"] } } } } }

  /api/records/{entity}/{record_id}/replies:
    post:
      tags: [Replies]
      operationId: replyFromRecord
      summary: Answer the reporters of a record
      description: |
        One answer to every person waiting from that source in that language — no alert or case needed. When the
        record has an open case, the answer is also kept on the case as a report to the reporter.
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: record_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Reply" } } }
      responses:
        "200": { description: How many were answered., content: { application/json: { schema: { type: object, properties: { reply_result: { $ref: "#/components/schemas/ReplyResult" }, case_id: { type: [string, "null"] } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/records/{entity}/{record_id}/replies/draft:
    post:
      tags: [Replies]
      operationId: draftReplyFromRecord
      summary: Draft the answer with AI
      description: A draft from the record and the source's instructions, to review before sending. Nothing is sent.
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: record_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [source], properties: { source: { type: string }, lang: { type: string, example: fr } } } } }
      responses:
        "200": { description: The draft., content: { application/json: { schema: { $ref: "#/components/schemas/Reply" } } } }

  /api/cases/{case_id}/replies:
    parameters: [{ $ref: "#/components/parameters/case_id" }]
    post:
      tags: [Replies]
      operationId: replyFromCase
      summary: Answer the reporters of a case
      description: The same as from a record; the answer is kept on the case as a report to the reporter.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Reply" } } }
      responses:
        "200": { description: "The case, with `reply_result`.", content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/cases/{case_id}/replies/draft:
    parameters: [{ $ref: "#/components/parameters/case_id" }]
    post:
      tags: [Replies]
      operationId: draftReplyFromCase
      summary: Draft a case's answer with AI
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [source], properties: { source: { type: string }, lang: { type: string } } } } }
      responses:
        "200": { description: The draft., content: { application/json: { schema: { $ref: "#/components/schemas/Reply" } } } }

  /api/coverage:
    get:
      tags: [Coverage]
      operationId: getCoverage
      summary: Coverage facts
      description: |
        Per scenario: where it was tested (synthetic datasets, labelled data), pentested, declared in service on
        another engine, exported — and since when each fact holds.
      responses:
        "200": { description: The facts., content: { application/json: { schema: { type: object, properties: { tested: { type: object }, pentested: { type: object }, external: { type: object }, exports: { type: object }, since: { type: object } } } } } }

  /api/activity:
    get:
      tags: [Coverage]
      operationId: getActivity
      summary: Engineering activity
      description: Calibrations, library changes, deployments declared or withdrawn, exports and runs over the last days.
      parameters: [{ name: days, in: query, schema: { type: integer, default: 30 } }]
      responses:
        "200": { description: The activity., content: { application/json: { schema: { type: object } } } }

  /api/deployments:
    post:
      tags: [Coverage]
      operationId: declareDeployment
      summary: Declare a scenario in service elsewhere
      description: A scenario that runs on the institution's own engine, so that Coverage and Pentesting count it.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scenario, engine], properties: { scenario: { type: string }, engine: { type: string }, since: { type: string, format: date } } } } }
      responses:
        "200": { description: Declared., content: { application/json: { schema: { type: object } } } }

  /api/deployments/withdraw:
    post:
      tags: [Coverage]
      operationId: withdrawDeployment
      summary: Withdraw a declared scenario
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scenario, engine], properties: { scenario: { type: string }, engine: { type: string } } } } }
      responses:
        "200": { description: Withdrawn., content: { application/json: { schema: { type: object } } } }

  /api/pentest:
    get:
      tags: [Pentesting]
      operationId: getPentest
      summary: Targets, journeys, cases and runs
      description: |
        Fraud Pentesting plays a fraudster's behaviour on the institution's own application in staging — with its
        written authorisation — and records what its defences did at each step.
      parameters: [{ name: target, in: query, schema: { type: string } }]
      responses:
        "200": { description: The pentesting state of a target., content: { application/json: { schema: { type: object } } } }

  /api/pentest/runs/{pentest_run_id}:
    get:
      tags: [Pentesting]
      operationId: getPentestRun
      summary: A pentest run
      description: "Each action with its screenshot, and the verdict step by step: blocked, friction, allowed or not reached."
      parameters: [{ name: pentest_run_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The run., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/pentest/{step}:
    post:
      tags: [Pentesting]
      operationId: startPentestStep
      summary: Discover, plan or run
      description: |
        `discover`: a browser follows the target's pages and groups them into journeys. `plan`: malicious cases drawn
        from the library for those journeys (mode `gaps`: any scenario the site can play; `deployed`: only the scenarios
        declared in service). `run`: one case played in a browser. Each starts a background job.
      parameters: [{ name: step, in: path, required: true, schema: { type: string, enum: [discover, plan, run] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, description: With discover and plan. }
                mode: { type: string, enum: [gaps, deployed], default: gaps, description: With plan. }
                case: { type: string, description: With run. }
      responses:
        "200": { description: The job started., content: { application/json: { schema: { type: object, properties: { job: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/kit/markers:
    get:
      tags: [Kit hunting]
      operationId: listKitMarkers
      summary: List a kit's markers
      description: The markers of a reverse-engineering run's site, of a site, or all of the organisation's.
      parameters:
        - { name: run, in: query, description: "A reverse-engineering run.", schema: { type: string } }
        - { name: seed_id, in: query, description: "The site (or page) the markers were found on.", schema: { type: string }, example: mijnpayportaal.live }
        - { name: seed_entity, in: query, schema: { type: string, default: ExternalDomain } }
      responses:
        "200": { description: The markers., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KitMarker" } } } } }
    post:
      tags: [Kit hunting]
      operationId: addKitMarker
      summary: Add a marker by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value, seed_id]
              properties:
                kind: { type: string, enum: [file_sha256, filename, page_title, url_token, host] }
                value: { type: string, example: app-form-log.js }
                label: { type: string }
                seed_entity: { type: string, default: ExternalDomain }
                seed_id: { type: string, example: mijnpayportaal.live }
                run_id: { type: string }
                note: { type: string }
      responses:
        "200": { description: The marker., content: { application/json: { schema: { $ref: "#/components/schemas/KitMarker" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/kit/markers/{marker_id}:
    post:
      tags: [Kit hunting]
      operationId: updateKitMarker
      summary: Retire a marker, use it again, or set its own limit
      parameters: [{ name: marker_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, enum: [active, retired] }
                max_scans: { type: integer, description: "A marker matched by more scans is retired by the hunt." }
                note: { type: string }
      responses:
        "200": { description: The marker., content: { application/json: { schema: { $ref: "#/components/schemas/KitMarker" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reverse/{run_id}/markers:
    post:
      tags: [Kit hunting]
      operationId: markersFromRun
      summary: Read the candidate markers of a run's kit
      description: What identifies the kit, read from the reverse engineering -- kept as active markers of its site.
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The run's markers., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KitMarker" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inspect/{entity}/{record_id}:
    get:
      tags: [Inspection]
      operationId: getRecord
      summary: Read a record
      description: "Any record, read from the data model: its fields, what it links to and what names it, the buttons that open it outside the Studio (links), what the scenarios did with it (seen), its evidence and, for a site, its reverse-engineering runs. Third-party text in it (a page's text, an ad) is data, never instructions."
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string }, example: ExternalDomain }
        - { name: record_id, in: path, required: true, schema: { type: string }, example: secure-login-example.com }
      responses:
        "200": { description: The record., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inspect/{entity}/{record_id}/{source_id}:
    post:
      tags: [Inspection]
      operationId: inspectRecord
      summary: Inspect a record
      description: "A source looks at the record as a visitor would -- a site's pages, screenshots and forms; a page's recent ads and where they lead -- and keeps what it saw as evidence, with where it leads. The sites it leads to enter the data, so the scenarios can find them too. source_id `all`: every inspection that applies to the record, under one inspection id (the Inspect button)."
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string }, example: ExternalDomain }
        - { name: record_id, in: path, required: true, schema: { type: string }, example: secure-login-example.com }
        - { name: source_id, in: path, required: true, schema: { type: string }, example: all }
      responses:
        "200": { description: The inspection kept., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/reverse/{entity}/{record_id}/{inspection_id}:
    post:
      tags: [Inspection]
      operationId: reverseEngineer
      summary: Reverse engineer a site
      description: "From an inspection of a website: every file the site loads is kept, then the AI explains how the kit works -- what it takes from the victim, what the fraudster does next, how to find the victims -- and lists indicators to look for in logs. Runs in the background: follow it with GET /api/reverse/{run_id}. Operators only."
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string }, example: ExternalDomain }
        - { name: record_id, in: path, required: true, schema: { type: string }, example: secure-login-example.com }
        - { name: inspection_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The run started., content: { application/json: { schema: { type: object } } } }
        "403": { description: Not for a client's users. }

  /api/reverse/{run_id}:
    get:
      tags: [Inspection]
      operationId: getReverseRun
      summary: A reverse-engineering run
      description: Its state (running, done, error), the pages opened, how many files were kept, and the analysis once done.
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The run., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reverse/{run_id}/files:
    get:
      tags: [Inspection]
      operationId: getReverseFiles
      summary: The files a run kept
      description: Every file the site loaded, as a zip archive. They are the fraudster's files -- open them with care.
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: A zip archive., content: { application/zip: {} } }

  /api/reverse/{run_id}/siblings:
    get:
      tags: [Kit hunting]
      operationId: getKitSiblings
      summary: The other sites of the same kit
      description: The sites a hunt found from this run's site, with the markers each one shares and when it was last seen.
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The sites., content: { application/json: { schema: { type: array, items: { type: object } } } } }

  /api/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Read the settings
      responses:
        "200": { description: The settings., content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    post:
      tags: [Settings]
      operationId: setSettings
      summary: Change the settings
      description: Only the keys given change.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Settings" }, example: { isolated_browser: "https://isolation.example-bank.com/#/go?kasm_url={raw_url}" } } }
      responses:
        "200": { description: The settings., content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/kit/hunt:
    post:
      tags: [Kit hunting]
      operationId: huntKit
      summary: Hunt a kit
      description: Every active marker -- of a run's site, of a site, or all of the organisation's -- searched in the public page scans. The sites found become findings of the seed's group, with its brands. Runs in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                run: { type: string }
                seed_id: { type: string }
                seed_entity: { type: string }
                all: { type: boolean }
                analyze: { type: boolean, description: "Then the seed's use case analysed with AI on the sites found, and only them." }
      responses:
        "200": { description: The job., content: { application/json: { schema: { $ref: "#/components/schemas/KitHunt" } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/kit/siblings/remove:
    post:
      tags: [Kit hunting]
      operationId: removeKitSibling
      summary: Remove a wrong kit sibling
      description: A site wrongly taken for a sibling -- of one seed, or of every seed -- removed and kept out of the next hunts. Its record and any alert stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: example-garage.com }
                seed_id: { type: string }
                seed_entity: { type: string, default: ExternalDomain }
                reason: { type: string }
      responses:
        "200": { description: What was removed., content: { application/json: { schema: { type: object, properties: { domain: { type: string }, seed: { type: [string, "null"] }, removed: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /api/kit/hunt/{job_id}:
    get:
      tags: [Kit hunting]
      operationId: getKitHunt
      summary: Follow a hunt
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The job., content: { application/json: { schema: { $ref: "#/components/schemas/KitHunt" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "A Studio API key, created by an administrator." }
  parameters:
    scenario_id: { name: scenario_id, in: path, required: true, schema: { type: string }, example: FSL-CRP-001 }
    alert_id: { name: alert_id, in: path, required: true, schema: { type: string } }
    case_id: { name: case_id, in: path, required: true, schema: { type: string }, example: C-20261025-4d5e6f }
  responses:
    NotFound: { description: Not found., content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { error: not found } } } }
    Invalid: { description: Invalid request., content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { error: "a note is required for this reason" } } } }
  schemas:
    BrandScope:
      type: object
      properties:
        brands: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, in_list: { type: boolean } } } }
        missing_from_list: { type: array, items: { type: string } }
        not_protected: { type: array, items: { type: string } }
    Settings:
      type: object
      properties:
        in_use_only: { type: boolean, description: "The library shows only what is calibrated here." }
        isolated_browser: { type: string, description: "Every link to a site, a page or an ad opens in this isolated browser: an http(s) address with {url} (the link encoded) or {raw_url} (as is). Empty: the analyst's own browser." }
    KitMarker:
      type: object
      properties:
        marker_id: { type: string }
        kind: { type: string, enum: [file_sha256, filename, page_title, url_token, host] }
        value: { type: string }
        label: { type: string }
        seed_entity: { type: string }
        seed_id: { type: string }
        run_id: { type: string }
        state: { type: string, enum: [active, retired] }
        scans: { type: integer, description: "How many public scans matched it at the last hunt." }
        hits: { type: integer, description: "How many other sites it found." }
        max_scans: { type: integer }
        note: { type: string }
        hunted_at: { type: string }
    KitHunt:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [running, done, error] }
        stage: { type: string }
        markers: { type: integer }
        done: { type: integer }
        found: { type: integer, description: "Sites found." }
        sites: { type: array, items: { type: string }, description: "The sites found." }
        analyze: { type: boolean }
        passes: { type: array, items: { type: object, properties: { group: { type: string }, pass: { type: string }, sites: { type: integer } } }, description: "With analyze: the passes started, one per use case." }
        error: { type: string }
    Note:
      type: object
      required: [note]
      properties: { note: { type: string, description: "Why — kept with the new version." } }
    Step:
      type: object
      required: [role, text, indicator]
      properties:
        role: { type: string, enum: [given, when], description: "given: the population; when: a condition." }
        text: { type: string, description: "In plain words. Name a parameter as <name>." }
        indicator: { type: string, example: IND-SITE-IS-LIVE }
    ScenarioNew:
      type: object
      required: [typology, title, steps, note]
      properties:
        typology: { type: string }
        unit: { type: string, description: "What one alert is about; required when the typology has several." }
        title: { type: string, description: "The fraud as it shows, without its conditions." }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        severity: { type: string, enum: [low, medium, high, critical] }
        note: { type: string }
    ScenarioUpdate:
      type: object
      required: [steps, note]
      properties:
        title: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        questions:
          type: array
          description: The questions of its AI conditions.
          items: { type: object, properties: { key: { type: string }, question: { type: string }, answers: { type: array, items: { type: string } } } }
        note: { type: string }
    TriageUpdate:
      type: object
      required: [rules, note]
      properties:
        rules:
          type: array
          description: In order. Only the last rule may have no condition.
          items:
            type: object
            properties:
              name: { type: string }
              conditions: { type: array, items: { type: object, properties: { text: { type: string }, indicator: { type: string } } } }
              priority: { type: [string, "null"], enum: [critical, high, medium, low, null] }
              disposition: { type: [string, "null"], description: "A decision to propose — or a priority, not both." }
        note: { type: string }
    ListEntry:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        country: { type: string }
        url: { type: string }
        identifiers: { type: object, description: "Kind → values (name, domain, page id…).", additionalProperties: { type: array, items: { type: string } } }
    Error:
      type: object
      properties: { error: { type: string } }
    Entity:
      type: object
      description: The record an alert or a case is about.
      properties:
        type: { type: string, example: ExternalDomain }
        id: { type: string, example: secure-login-example.com }
        label: { type: string, description: "How it is shown. A site: the link it was found with, its path kept.", example: "https://secure-login-example.com/verify" }
    Alert:
      type: object
      properties:
        alert_id: { type: string }
        typology: { type: string, example: credential-phishing }
        scenarios: { type: array, items: { type: string }, example: [FSL-CRP-001] }
        entity: { $ref: "#/components/schemas/Entity" }
        url: { type: [string, "null"], description: "A site: the link it was found with." }
        title: { type: string }
        raised: { type: string, description: "When it was raised (UTC)." }
        status: { type: string, enum: [new, closed, escalated] }
        disposition: { type: [string, "null"], description: The reason it was closed with. }
        note: { type: [string, "null"] }
        case_id: { type: [string, "null"], description: The case it was escalated to. }
        subject_case: { type: [string, "null"], description: A case already open on the same subject. }
        triage:
          type: [object, "null"]
          description: The triage's proposal.
          properties:
            priority: { type: [string, "null"], enum: [critical, high, medium, low, null] }
            disposition: { type: [string, "null"] }
            rule: { type: [string, "null"] }
    AlertDecision:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [close, escalate, reopen, set_priority, merge] }
        into: { type: string, description: "With merge: the alert it is a duplicate of -- on the same site or page, open, in the same case." }
        disposition: { type: string, description: "With close: one of the typology's reasons." }
        priority: { type: string, enum: [critical, high, medium, low, ""], description: "With set_priority: the analyst's priority; empty goes back to the triage's." }
        note: { type: string, description: "Required with set_priority, and with the reasons that ask for one." }
    Case:
      type: object
      properties:
        case_id: { type: string }
        typologies: { type: array, items: { type: string } }
        entity: { $ref: "#/components/schemas/Entity" }
        status: { type: string, enum: [open, in_review, closed_confirmed_fraud, closed_confirmed_concern, closed_false_positive, closed_indeterminate] }
        disposition: { type: [string, "null"] }
        origin: { type: string, enum: [alert, manual] }
        alerts: { type: array, items: { type: string } }
        from_case: { type: [string, "null"], description: The case whose investigation led to this one. }
        opened: { type: string }
        opened_by: { type: string }
        closed: { type: [string, "null"] }
    CaseOpen:
      type: object
      required: [entity, id]
      properties:
        entity: { type: string, description: "The subject's type." }
        id: { type: string, description: "The subject's id." }
        typology: { type: string, description: "Required when several typologies have cases about this type." }
        note: { type: string }
        from_case: { type: string, description: "The case whose investigation found it." }
    CaseAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [review, close, reopen, note, qualify] }
        typology: { type: string }
        disposition: { type: string }
        note: { type: string }
        qual: { type: object, description: "With qualify: {payment_observed, values: {<group>: name | [names]}}." }
    Job:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        mode: { type: string }
        stage: { type: string }
        progress: { type: number, minimum: 0, maximum: 1 }
        finished: { type: boolean }
        status: { type: string, description: "ok | error | stopped, once finished." }
        error: { type: [string, "null"] }
        counts: { type: [object, "null"], description: "What was written, per entity." }
    Detection:
      type: object
      properties:
        unit_id: { type: string }
        entity: { $ref: "#/components/schemas/Entity" }
        url: { type: [string, "null"], description: "A site: the link it was found with." }
        title: { type: string }
        date: { type: [string, "null"] }
        hits: { type: array, description: "[scenario, path] that found it.", items: { type: array, items: { type: string } } }
        priority: { type: [string, "null"], enum: [critical, high, medium, low, null] }
        prev_priority: { type: [string, "null"], description: Its priority in the previous run of the analysis. }
        new: { type: boolean, description: Not found by the previous run. }
        up: { type: boolean, description: Its priority rose. }
        sent: { type: boolean, description: Already in Alerts. }
    Finding:
      type: object
      properties:
        id: { type: string, example: "ExternalDomain|secure-login-example.com" }
        group: { type: string, description: "The use case., example: online-scams" }
        entity: { $ref: "#/components/schemas/Entity" }
        url: { type: [string, "null"], description: "The link it was found with." }
        state: { type: string, enum: [to_triage, triaged, new, escalated, closed, watch, blocked, unmatched] }
        priority: { type: [string, "null"], enum: [critical, high, medium, low, null] }
        typologies: { type: array, items: { type: string } }
        scenarios: { type: array, items: { type: string } }
        alerts: { type: array, items: { type: string } }
        cases: { type: array, items: { type: string } }
        brands: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
        first_seen: { type: [string, "null"] }
        last_seen: { type: [string, "null"] }
        waiting: { type: integer, description: People who reported it and wait for an answer. }
    Organisation:
      type: object
      properties:
        id: { type: string, example: bank-1 }
        name: { type: string, example: Organisation 1 }
        description: { type: [string, "null"] }
    ShareRequest:
      type: object
      required: [kind, to]
      properties:
        kind: { type: string, enum: [case, scenario, signals] }
        ref: { type: string, description: "With case: the case id. With scenario: the scenario id." }
        signals:
          type: array
          description: With signals.
          items: { type: object, required: [value], properties: { kind: { type: string, default: account }, value: { type: string }, label: { type: string }, since: { type: string, format: date, description: When the sender detected it. } } }
        to: { type: array, items: { type: string }, description: The organisations that receive it. }
        title: { type: string }
        note: { type: string }
    SharedItem:
      type: object
      properties:
        id: { type: string }
        batch: { type: string, description: One send to several organisations. }
        kind: { type: string, enum: [case, scenario, signals] }
        from: { $ref: "#/components/schemas/Organisation" }
        to: { $ref: "#/components/schemas/Organisation" }
        relation: { type: string, enum: [service, peer], description: "service: from the platform's threat-intelligence service." }
        title: { type: string }
        note: { type: [string, "null"] }
        payload: { type: object, description: "case_share, signals, scenarios — what was shared, nothing of the receiver's data." }
        status: { type: string, enum: [new, accepted, dismissed] }
        outcome: { type: [object, "null"], description: "What accepting did: watchlisted, activated." }
        sent_at: { type: string }
        handled_at: { type: [string, "null"] }
    Reporters:
      type: object
      properties:
        source: { type: string }
        name: { type: string }
        waiting: { type: array, items: { type: object }, description: The reports still waiting for an answer. }
        answered: { type: integer }
        langs: { type: object, description: "Language → how many wait.", additionalProperties: { type: integer } }
        outcomes: { type: object, description: "The outcomes the source accepts: id → label.", additionalProperties: { type: string } }
        observations_required: { type: array, items: { type: string }, description: The outcomes that must say what was observed. }
        can_draft: { type: boolean, description: The source gives instructions for an AI draft. }
    Reply:
      type: object
      required: [source, outcome, summary]
      properties:
        source: { type: string }
        lang: { type: string, description: "Only the reporters in this language (default: all).", example: fr }
        outcome: { type: string, description: One of the source's outcomes. }
        summary: { type: string }
        observations: { type: array, items: { type: object, required: [title], properties: { title: { type: string }, detail: { type: string } } } }
        advice: { type: array, items: { type: string } }
    ReplyResult:
      type: object
      properties:
        sent: { type: integer }
        failed: { type: array, items: { type: string } }
